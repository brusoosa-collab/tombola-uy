name: Actualizar datos DNLQ

on:
  schedule:
    # Una consulta diaria; los horarios Hobby de Cloudflare/Vercel no aplican.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar historial DNLQ
        run: python scraper/scrape.py

      - name: Generar datos para el navegador
        run: python scraper/export_js.py

      - name: Publicar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tombola.json data/tombola.js
          git diff --cached --quiet || git commit -m "chore: actualizar datos DNLQ"
          git push
