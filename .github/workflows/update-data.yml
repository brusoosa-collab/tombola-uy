name: Actualizar datos DNLQ

on:
  schedule:
    # 03:15, 15:30 y 21:30 aproximadamente en Uruguay (UTC-3).
    - cron: "15 6 * * *"
    - cron: "30 18 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-dnlq
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar historial DNLQ
        run: python scraper/scrape.py

      - name: Generar datos para el navegador
        run: python scraper/export_js.py

      - name: Publicar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tombola.json data/tombola.js
          git diff --cached --quiet || git commit -m "chore: actualizar datos DNLQ"
          git push
